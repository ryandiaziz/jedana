version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jedana_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jedana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jedana_password}
      POSTGRES_DB: ${POSTGRES_DB:-jedana_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jedana_user} -d ${POSTGRES_DB:-jedana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: jedana_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-jedana_user}:${POSTGRES_PASSWORD:-jedana_password}@postgres:5432/${POSTGRES_DB:-jedana_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jedana_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
