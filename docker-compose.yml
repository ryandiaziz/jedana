version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: jedana_server
    restart: always
    networks:
      - shared_net
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: ${POSTGRES_HOST:-shared_postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-jedana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jedana_password}
      POSTGRES_DB: ${POSTGRES_DB:-jedana_db}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-jedana_user}:${POSTGRES_PASSWORD:-jedana_password}@${POSTGRES_HOST:-shared_postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-jedana_db}}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/api/auth/google/callback}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jedana_web
    restart: always
    ports:
      - "80:80"
    networks:
      - shared_net
    depends_on:
      - server

networks:
  shared_net:
    external: true
