# Jedana production vhost — installed on the HOST nginx (TLS terminator).
# The container nginx must NOT set these headers again (no duplicate values).
# Install: sudo cp deploy/nginx/jedana.my.id.conf /etc/nginx/sites-available/
#          sudo ln -s ../sites-available/jedana.my.id.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name jedana.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jedana.my.id;

    ssl_certificate     /etc/letsencrypt/live/jedana.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jedana.my.id/privkey.pem;

    # Security headers: single source for the HTML app shell (ADR-0009).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-frswxUrImuwGA7FQd/c1VLFGp1osUQ/sBF/c2sYPlYs='; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Existing production behaviour: proxy everything to the Jedana web container.
    # Replace this block with the current vhost body (root/try_files vs proxy_pass) —
    # header block above must stay.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
