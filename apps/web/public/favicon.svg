<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="jedana-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="jedana-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ribbon-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="ribbon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Bento Container -->
  <rect width="48" height="48" rx="14" fill="url(#jedana-bg)" />
  <rect width="48" height="48" rx="14" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Ambient Glow -->
  <circle cx="28" cy="20" r="14" fill="url(#jedana-glow)" />

  <!-- Primary Stem: "Jeda" (Mindful Anchor & J Curve) -->
  <path d="M28 12V27C28 31.4183 24.4183 35 20 35C15.5817 35 12 31.4183 12 27C12 22.5817 15.5817 19 20 19" 
        stroke="url(#ribbon-indigo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flowing Cashflow Ribbon: "Dana" (Wealth & Continuity Loop) -->
  <path d="M20 19C24.4183 19 28 22.5817 28 27C28 31.4183 31.5817 35 36 35" 
        stroke="url(#ribbon-emerald)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Anchor Accent -->
  <circle cx="28" cy="12" r="2.25" fill="#C7D2FE" />
</svg>