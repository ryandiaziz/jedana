<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jedana" />
    <meta name="description" content="Personal finance tracker with offline-first support" />
    <script>
      (function () {
        try {
          var storageKey = 'jedana-theme';
          var savedTheme = localStorage.getItem(storageKey);
          var theme = savedTheme || 'dark';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#090d16' : '#f8fafc');
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html {
        background-color: #090d16;
        color-scheme: dark;
      }
      html.light {
        background-color: #f8fafc;
        color-scheme: light;
      }
      html.dark {
        background-color: #090d16;
        color-scheme: dark;
      }
      body {
        background-color: inherit;
        color: inherit;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Jedana - Personal Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
