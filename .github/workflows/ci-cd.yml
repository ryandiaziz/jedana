name: Jedana Production Release & Auto-Deploy Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

jobs:
  lint-build-test:
    name: Lint, Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check TypeScript & Monorepo Build
        run: npm run build

      - name: Run Workspace Unit Tests
        run: npm test

  docker-build:
    name: Build & Verify Docker Images
    needs: lint-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: jedana-server:latest

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: jedana-web:latest

  deploy:
    name: Auto-Deploy to VPS via SSH
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Remote VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            cd ${{ secrets.PROJECT_PATH || '/var/www/jedana' }}
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose up -d --build
