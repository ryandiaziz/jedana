name: Jedana Production Release & Auto-Deploy Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

jobs:
  lint-build-test:
    name: Lint, Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Assert patched Node runtime
        run: |
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj !== 24 || min < 22) { console.error('Node ' + process.versions.node + ' is below the patched 24.22.x line (CVE-2026-111497)'); process.exit(1); }"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check TypeScript & Monorepo Build
        run: npm run build

      - name: Run Workspace Unit Tests
        run: npm test

  docker-build:
    name: Build & Verify Docker Images
    needs: lint-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: jedana-server:latest

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: jedana-web:latest

  deploy:
    name: Auto-Deploy on VPS (self-hosted)
    needs: docker-build
    runs-on: [self-hosted, jedana-deploy]

    steps:
      - name: Deploy on VPS
        run: |
          set -e
          cd /var/www/jedana
          git fetch --tags --force origin
          git checkout --force "${{ github.ref_name }}"
          docker compose -f docker-compose.deploy.yml up -d --build
          git checkout --force master
